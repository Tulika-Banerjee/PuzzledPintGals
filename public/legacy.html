<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzled Pint Gals Advent Calendar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&family=Sacramento&display=swap">
<style>
:root{
  --bg:#fbf6ed;--card:#fffdf8;--fg:#31483e;--mut:#79877b;
  --red:#a94a45;--green:#3e6d58;--gold:#d7ac68;--line:#e3dfd1;
  --g:#498e70;--y:#dbab4e;--x:#8d908b;
  box-sizing:border-box;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--fg);
  font:500 16px/1.5 'DM Sans',sans-serif;
  background: radial-gradient(circle at 14% 4%,rgba(234,201,185,.27),transparent 33%),
              radial-gradient(circle at 95% 44%,rgba(202,222,199,.33),transparent 38%),
              var(--bg);
}
main{position:relative;z-index:1;max-width:770px;margin:0 auto;padding:18px 22px 62px}
.lights{position:relative;z-index:1;display:flex;justify-content:space-around;padding:0 10px;height:31px;
  background:linear-gradient(#aab6a8,#aab6a8) 0 4px/100% 1px no-repeat;opacity:.75}
.lights i{width:8px;height:12px;margin-top:5px;border-radius:50% 50% 45% 45%;background:var(--c);
  box-shadow:0 0 8px 2px var(--c);animation:tw 2.5s infinite alternate}
@keyframes tw{to{opacity:.35;box-shadow:0 0 3px 0 var(--c)}}
.sn{position:fixed;top:-8vh;z-index:0;pointer-events:none;user-select:none;line-height:1;
  color:#fff;opacity:.7;filter:drop-shadow(0 0 4px rgba(255,255,255,.22));
  animation:flakeFall linear infinite}
.sn svg{display:block;width:100%;height:100%;stroke:#fff;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes flakeFall{0%{transform:translate3d(0,-8vh,0) rotate(0deg);opacity:0}12%{opacity:.72}100%{transform:translate3d(var(--drift,28px),110vh,0) rotate(220deg);opacity:.18}}
.hero{text-align:center;padding:38px 0 9px}
.hero .eyebrow{font:700 11px/1.4 'DM Sans',sans-serif;letter-spacing:.29em;text-transform:uppercase;
  color:#a48272;margin:0 0 3px}
h1{font:400 clamp(60px,10.5vw,90px)/.95 'Sacramento',cursive;color:#405f50;margin:8px 0 2px;
  text-shadow:1px 1px 0 #f7f1e5}
.hero .headline-caption{font:700 15px/1.5 'DM Sans',sans-serif;letter-spacing:.48em;
  color:#567464;margin:0 0 11px;padding-left:.48em}
.hero .dedication{font:500 14px/1.5 'DM Sans',sans-serif;color:#9b6f65;margin:0}
.sub{color:var(--mut);text-align:center;margin:8px 0 0;font-size:13px}
.eye{text-align:center;margin:10px 0 0;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  color:var(--green);font-size:12px}
.cane{height:1px;max-width:260px;margin:18px auto 22px;background:linear-gradient(90deg,transparent,#d0b7a0,transparent);
  position:relative}
.cane::after{content:'✳';font-size:14px;color:#bf9882;background:var(--bg);padding:0 10px;
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
/* Staggered, editorial-style advent patchwork. The tile's photo becomes its face when completed. */
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(77px,17vw,151px);
  grid-auto-flow:row dense;grid-template-rows:clamp(130px,22vw,195px) repeat(10,clamp(77px,17vw,151px));gap:9px}
.cell{min-width:0;min-height:0}
.cell.wide{grid-column:span 2}
.cell.tall{grid-row:span 2}
.cell.feature{grid-column:span 2;grid-row:span 2}
.door{
  --tile:#d9e9df;--ink:#2f574d;
  position:relative;display:block;width:100%;height:100%;min-height:0;overflow:hidden;
  text-align:left;padding:0;border:0;border-radius:4px;
  background:var(--tile);color:var(--ink);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(83,105,89,.05);
  transition:transform .23s ease,box-shadow .23s ease;
  isolation:isolate;
}
.door::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image: radial-gradient(circle,rgba(255,255,255,.46) 1.2px,transparent 1.6px),
                    radial-gradient(circle,rgba(68,83,66,.08) 1px,transparent 1.5px);
  background-size:34px 35px,51px 47px;background-position:4px 4px,14px 20px;opacity:.65}
.door::after{content:'✧';position:absolute;right:10px;top:6px;font-size:16px;opacity:.48;pointer-events:none}
.shade-0{--tile:#dfeadf;--ink:#30564a}
.shade-1{--tile:#eecacc;--ink:#8e4c4b}
.shade-2{--tile:#f5e1b8;--ink:#65563f}
.shade-3{--tile:#d6e6e5;--ink:#356761}
.shade-4{--tile:#f2d9c4;--ink:#935e4c}
.shade-5{--tile:#f0eee1;--ink:#4a6355}
.shade-6{--tile:#426e5f;--ink:#ffefe0}
.shade-7{--tile:#a9554e;--ink:#fff4e1}
.door .date{position:absolute;top:9px;left:13px;z-index:3;
  font:800 clamp(24px,4.4vw,43px)/1 'DM Sans',sans-serif;letter-spacing:-.07em}
.wide .door .date,.feature .door .date{font-size:clamp(32px,6vw,66px);top:12px;left:17px}
.tall .door .date{font-size:clamp(29px,5vw,54px)}
.door .art{position:absolute;z-index:1;right:-6%;bottom:-10%;width:82%;height:82%;
  transform:rotate(-7deg);pointer-events:none;display:grid;place-items:center}
.door .art svg{display:block;width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 3px 0 rgba(42,66,55,.07))}
.wide .door .art{width:56%;height:110%;right:2%;bottom:-11%;transform:rotate(7deg)}
.tall .door .art{width:135%;height:64%;right:-25%;bottom:8%}
.feature .door .art{width:95%;height:78%;right:-3%;bottom:-2%}
.door .tile-word{position:absolute;z-index:2;bottom:15px;left:17px;display:none;
  font:600 12px/1.2 'DM Sans',sans-serif;letter-spacing:.04em;max-width:42%;opacity:.78}
.wide .door .tile-word,.feature .door .tile-word{display:block}
.door .open-dot{position:absolute;z-index:3;right:11px;top:12px;border-radius:50%;width:6px;height:6px;
  background:currentColor;opacity:.75;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.door:hover:not(.lock),.door:focus-visible{transform:translateY(-3px);
  box-shadow:0 9px 22px rgba(57,79,62,.14)}
.door:focus-visible{outline:3px solid #d6a365;outline-offset:3px}
.door.pop{animation:pop .33s forwards}
@keyframes pop{50%{transform:scale(1.035) rotate(-1deg)}100%{transform:scale(1)}}
.door.lock{cursor:not-allowed}
.door.lock .open-dot{display:none}
.door.lock .art{opacity:.78}
/* Solved tile: full-bleed memory with a little day-number stamp. */
.door.done{background:#e4e5d7;border:3px solid #f9efe0;
  box-shadow:0 0 0 1px #d8c6ad,0 4px 10px rgba(53,67,58,.1)}
.door.done::before,.door.done::after{display:none}
.door.done .art,.door.done .tile-word,.door.done .open-dot{display:none}
.door .memory-img{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.memory-img.photo-zoom-10{transform:scale(1.13);transform-origin:50% 50%}
.door .memory-shade{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(25,42,32,.31),transparent 44%)}
.door.done .date{font-size:17px;letter-spacing:0;top:9px;left:9px;
  display:flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 5px;
  border-radius:50%;background:#fffbf1;color:#466252;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.door.done .memory-check{position:absolute;top:10px;right:10px;z-index:3;
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:#fbf6ea;color:#4f755c;font-size:15px;font-weight:800}
.door .missing-photo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;color:#486f60;text-align:center;padding:20px 9px 4px;
  background:linear-gradient(145deg,#e2eee5,#f4dfd1)}
.door .missing-photo svg{width:30px;height:30px}
.door .missing-photo span{font-size:11px;font-weight:800;line-height:1.2}
.board-head{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 12px}
.board-heading{font:700 11px/1.5 'DM Sans',sans-serif;letter-spacing:.15em;text-transform:uppercase;
  color:#698171}
.board-progress{font:700 11px/1.4 'DM Sans',sans-serif;color:#956960}
.board-note{color:#829084;font-size:12px;text-align:center;margin:18px 0 3px}
.board-note span{color:#b96f65;font-size:16px;vertical-align:middle}
.progress-track{width:100%;height:4px;border-radius:10px;background:#ebe6d9;margin:12px 0 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#a4bba8,#c59183);transition:width .4s;border-radius:10px}
.puzzle-title{font:600 clamp(34px,6vw,48px)/1.1 'Fraunces',serif;color:#476855;text-shadow:none;margin:6px 0}
.puzzle-hero{padding:3px 0 0}
@media(max-width:520px){
  main{padding:6px 12px 42px}
  .doors{grid-auto-rows:clamp(70px,22vw,108px);grid-template-rows:clamp(108px,29vw,155px) repeat(10,clamp(70px,22vw,108px));gap:6px}
  .door .date{top:7px;left:8px;font-size:clamp(22px,6vw,32px)}
  .wide .door .date,.feature .door .date{top:9px;left:12px;font-size:clamp(29px,8vw,44px)}
  .door .tile-word{bottom:9px;left:12px;font-size:10px}
  .door.done .date{left:6px;top:6px;font-size:13px;min-width:28px;height:28px}
  .door.done .memory-check{top:6px;right:6px;width:21px;height:21px;font-size:12px}
  .door .missing-photo span{font-size:9px}
  .door .missing-photo svg{width:24px;height:24px}
  .hero{padding:12px 0 8px}
  .card{padding:14px}
  .cw{padding:12px 2px}
  .t{width:38px;height:40px}
  .xc{width:40px;height:40px}
}
.card{background:var(--card);border-radius:18px;padding:22px;border:1px solid #e5e0d4;box-shadow:0 7px 25px rgba(57,78,64,.08)}
.row{display:flex;gap:8px;margin:12px 0}
input{flex:1;min-width:0;font:700 16px 'DM Sans',sans-serif;padding:11px 14px;border:2px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg)}
input:focus{outline:0;border-color:var(--green)}
.btn{font:800 15px 'DM Sans',sans-serif;padding:10px 20px;border:0;border-radius:999px;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4}
.btn.continue{display:block;margin:16px auto 0}
.btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.msg{color:var(--red);min-height:1.4em;margin:6px 0;font-size:14px;font-weight:800;text-align:center}
.big{font-size:24px;text-align:center;margin:10px 0}
.wr{display:flex;gap:5px;margin-bottom:5px;justify-content:center;flex-wrap:wrap}
.t{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font:800 22px 'DM Sans',sans-serif;color:#fff;border:2px solid var(--line);border-radius:6px;background:transparent;padding:0;color:var(--fg)}
.t.f{border-color:var(--fg);transform:scale(1.06)}
.t.g,.t.y,.t.x{color:#fff;border-color:transparent}
.t.g{background:var(--g)}.t.y{background:var(--y)}.t.x{background:var(--x)}
.tile{background:var(--gold);border-color:transparent;color:#5a1010;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
@keyframes flip{50%{transform:rotateX(90deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;max-width:38px;height:48px;padding:0;border:0;border-radius:6px;background:var(--line);color:var(--fg);font:800 13px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.k.w{max-width:58px;flex:1.6}
.k.g{background:var(--g);color:#fff}.k.y{background:var(--y);color:#fff}.k.x{background:var(--x);color:#fff}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cw{padding:16px 3px;border:0;border-radius:10px;background:var(--line);color:var(--fg);font:800 12px 'DM Sans',sans-serif;cursor:pointer;word-break:break-word;transition:transform .15s}
.cw:hover{transform:translateY(-2px)}
.cw.on{background:var(--red);color:#fff;transform:scale(.94)}
.gr{border-radius:10px;padding:10px;margin-bottom:6px;text-align:center;color:#2a1a10;font-size:14px;animation:in .4s}
.gr b{display:block;text-transform:uppercase;letter-spacing:1px}
@keyframes in{from{transform:scale(.6);opacity:0}}
.xg{display:grid;gap:3px;justify-content:center;margin:12px 0}
.xc{position:relative;width:46px;height:46px;background:#fff;border:2px solid var(--fg);border-radius:4px}
.xc.blk{background:var(--fg)}
.xc.bad{background:#ffb3b3}
.xc input{position:absolute;inset:0;width:100%;text-align:center;border:0;border-radius:0;padding:0;font:800 20px 'DM Sans',sans-serif;background:transparent;color:#222;text-transform:uppercase}
.xc input:focus{background:#fff3c4}
.xc small{position:absolute;top:1px;left:3px;font:800 10px 'DM Sans',sans-serif;color:#222;z-index:1;pointer-events:none}
.cl{padding-left:20px;margin:8px 0}
.sl .sr{display:grid;grid-template-columns:92px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:14px;animation:in .3s}
.sr s{display:block;height:12px;border-radius:6px;background:var(--line);text-decoration:none;overflow:hidden}
.sr s i{display:block;height:100%;border-radius:6px}
.sr em{font-style:normal;text-align:right;font-weight:800}
.win{text-align:center}
.win h2{font:600 32px 'Fraunces',Georgia,serif;color:var(--red);margin:0 0 10px}
.pol{background:#fff;color:#3b1a1a;padding:12px 12px 6px;border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.3);transform:rotate(-2deg);animation:in .6s;position:relative;max-width:420px;margin:12px auto}
.pol::before{content:'';position:absolute;top:-10px;left:50%;width:90px;height:22px;transform:translateX(-50%) rotate(3deg);background:rgba(242,183,5,.75)}
.pol img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.ph{aspect-ratio:4/3;background:linear-gradient(145deg,#deeadf,#f4d8c6);color:#4c7661;
  display:flex;align-items:center;justify-content:center;gap:8px;flex-direction:column;font-weight:800;padding:12px}
.pol p{margin:8px 0;font:600 22px 'Fraunces',Georgia,serif}
.gift{margin:18px auto 4px;padding:18px;max-width:420px;border-radius:12px;color:#fff;font-weight:800;background:linear-gradient(90deg,transparent 44%,#fff3c4 44% 56%,transparent 56%),var(--red);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.gift span{background:var(--red);padding:2px 10px;border-radius:8px}
.back{background:none;border:0;color:var(--green);cursor:pointer;font:800 15px 'DM Sans',sans-serif;padding:8px 0}
.cf{position:fixed;top:40%;width:9px;height:15px;z-index:50;pointer-events:none;animation:cf 1.8s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),70vh) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* Quick calendar switching only appears while TEST_MODE is true. */
.test-picker-title{font-size:12px;text-align:center;letter-spacing:1.5px;text-transform:uppercase;margin:20px 0 8px;color:var(--mut)}
.test-picker{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 24px}
.test-friend{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--fg);padding:9px 13px;font:800 13px Nunito,system-ui,sans-serif;cursor:pointer}
.test-friend:hover{border-color:var(--green)}
.switch-calendar{display:block;margin:6px auto 0;padding:7px 12px;border:0;background:transparent;color:var(--green);font:800 13px Nunito,system-ui,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.home-shell{max-width:680px;margin:0 auto;position:relative}
.floating-memories{position:relative;height:330px;max-width:680px;margin:18px auto 0;pointer-events:none;filter:saturate(.92)}
.float-polaroid{position:absolute;width:150px;background:rgba(255,255,255,.68);padding:12px 12px 20px;border-radius:8px;
  box-shadow:0 16px 34px rgba(75,94,82,.08),0 3px 8px rgba(75,94,82,.05);transform-origin:center center;
  animation:floaty 12.5s ease-in-out infinite;border:1px solid rgba(255,255,255,.7);opacity:.72;backdrop-filter:blur(1.2px)}
.float-polaroid:nth-child(2n){animation-duration:13.4s}
.float-polaroid:nth-child(3n){animation-duration:14.2s}
.float-polaroid:nth-child(4n){animation-duration:11.8s}
.float-photo{display:grid;place-items:center;aspect-ratio:1;background:linear-gradient(135deg,rgba(245,237,224,.82),rgba(223,234,226,.78));
  overflow:hidden;color:#6d8374;border-radius:3px}
.float-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.95) contrast(.97)}
.float-photo .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 13px/1.15 'DM Sans',sans-serif;text-align:center;padding:12px;opacity:.8}
.float-photo .placeholder svg{width:34px;height:34px}
@keyframes floaty{0%,100%{transform:translate3d(0,0,0) rotate(var(--tilt,-3deg))}25%{transform:translate3d(-2px,-3px,0) rotate(calc(var(--tilt,-3deg) - .35deg))}50%{transform:translate3d(3px,-5px,0) rotate(calc(var(--tilt,-3deg) + .45deg))}75%{transform:translate3d(-1px,-2px,0) rotate(calc(var(--tilt,-3deg) + .2deg))}}

.art.a-tree svg,.art.a-wreath svg,.art.a-holly svg{animation:sway 4.8s ease-in-out infinite}
.art.a-stocking svg,.art.a-mitten svg,.art.a-bow svg{animation:bob 3.8s ease-in-out infinite}
.art.a-snowflake svg,.art.a-star svg,.art.a-ornament svg{animation:spinPulse 5.2s ease-in-out infinite}
.art.a-gingerbread svg,.art.a-present svg,.art.a-bell svg{animation:wiggle 4.4s ease-in-out infinite}
.art.a-candy svg,.art.a-cocoa svg,.art.a-hat svg,.art.a-snowman svg{animation:gentleBounce 4.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-2px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes spinPulse{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(8deg) scale(1.03)}}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes gentleBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.015)}}


/* Photo mosaic test preview — visible only in test/preview mode */
.photo-preview-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:7px 16px;margin:4px 0 18px;padding:11px 15px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.67)}
.photo-preview-toggle{display:flex;align-items:center;gap:9px;color:var(--fg);font:700 13px/1.4 'DM Sans',sans-serif;cursor:pointer}
.photo-preview-toggle input{width:18px;height:18px;margin:0;accent-color:var(--green);cursor:pointer}
.photo-preview-help{font:500 11px/1.4 'DM Sans',sans-serif;color:var(--mut)}
.door.photo-preview{cursor:pointer}
@media(max-width:480px){.photo-preview-bar{align-items:flex-start;flex-direction:column}}

/* Photo reveal: photo-only face, with a 3D flip back to the original date tile. */
.door.flip-tile{perspective:1000px;border:0;overflow:visible;background:transparent;isolation:isolate}
.door.flip-tile::before,.door.flip-tile::after{display:none}
.door.flip-tile .flip-inner{position:absolute;inset:0;display:block;transform-style:preserve-3d;
  transition:transform .62s cubic-bezier(.2,.7,.2,1);border-radius:inherit}
@media (hover:hover) and (pointer:fine){.door.flip-tile:hover .flip-inner{transform:rotateY(180deg)}}
.door.flip-tile.flipped .flip-inner,.door.flip-tile:focus-visible .flip-inner{transform:rotateY(180deg)}
.door.flip-tile .flip-face{position:absolute;inset:0;display:block;overflow:hidden;border-radius:4px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:flat}
.door.flip-tile .flip-front{background:#e4e5d7;transform:rotateY(0deg)}
.door.flip-tile .flip-back{background:var(--tile);color:var(--ink);transform:rotateY(180deg)}
.door.flip-tile .flip-back::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.46) 1.2px,transparent 1.6px),radial-gradient(circle,rgba(68,83,66,.08) 1px,transparent 1.5px);

function ask(el,answers,done,ph){
  const f=h('div','row'),i=h('input'),b=h('button','btn','Check'),m=h('p','msg');i.placeholder=ph||'Your answer';
  const go=()=>{if(answers.map(norm).includes(norm(i.value)))done();else{m.textContent='Not quite, try again!';shake(f)}};
  b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};f.append(i,b);el.append(f,m);
}
function wordle(el,d,done){
  const w=d.word.toUpperCase(),n=w.length,rank={x:1,y:2,g:3},ks={},rows=[],grid=h('div'),kb=h('div','kb'),m=h('p','msg');
  let cur='',r=0,over=false;
  for(let i=0;i<6;i++){const row=h('div','wr');for(let j=0;j<n;j++)row.append(h('span','t'));rows.push(row);grid.append(row)}
  const paint=()=>[...rows[r].children].forEach((t,j)=>{t.textContent=cur[j]||'';t.classList.toggle('f',!!cur[j])});
  const score=x=>{const o=Array(n).fill('x'),u=w.split('');
    for(let k=0;k<n;k++)if(x[k]===w[k]){o[k]='g';u[k]=null}
    for(let k=0;k<n;k++)if(o[k]==='x'){const p=u.indexOf(x[k]);if(p>-1){o[k]='y';u[p]=null}}
    return o};
  const reset=()=>{rows.forEach(rw=>[...rw.children].forEach(t=>{t.className='t';t.textContent='';t.style.animation=''}));
    Object.values(ks).forEach(k=>{k.classList.remove('x','y','g');delete k.dataset.s});r=0;cur='';over=false};
  const enter=()=>{
    if(cur.length<n){m.textContent='Need '+n+' letters';shake(rows[r]);return}
    const x=cur,row=rows[r];over=true;m.textContent='';
    score(x).forEach((c,k)=>{const t=row.children[k];t.style.animation='flip .5s '+k*.2+'s both';
      setTimeout(()=>{t.classList.remove('f');t.classList.add(c);const kk=ks[x[k]];
        if(kk&&rank[c]>(rank[kk.dataset.s]||0)){kk.classList.remove('x','y','g');kk.classList.add(c);kk.dataset.s=c}},k*200+250)});
    setTimeout(()=>{if(x===w)done();else if(r>=5){m.textContent='Out of guesses. Fresh board, try again!';reset()}else{r++;cur='';over=false}},n*200+600)};
  const press=k=>{if(over)return;if(k==='ENTER')enter();else if(k==='DEL'){cur=cur.slice(0,-1);paint()}else if(cur.length<n){cur+=k;paint()}};
  [[...'QWERTYUIOP'],[...'ASDFGHJKL'],['ENTER',...'ZXCVBNM','DEL']].forEach(rw=>{const kr=h('div','kr');
    rw.forEach(k=>{const b=h('button','k'+(k.length>1?' w':''),k==='DEL'?'Del':k==='ENTER'?'Enter':k);
      b.onmousedown=e=>e.preventDefault();b.onclick=()=>press(k);if(k.length===1)ks[k]=b;kr.append(b)});kb.append(kr)});
  document.onkeydown=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key==='Backspace'?'DEL':e.key.toUpperCase();if(k==='ENTER'||k==='DEL'||/^[A-Z]$/.test(k))press(k)};
  el.append(h('p','big','Guess the '+n+'-letter word in 6 tries'),grid,m,kb);
}
function connections(el,d,done){
  const grid=h('div','cg'),solved=h('div'),m=h('p','msg'),bar=h('div','row'),cols=['#f6d04d','#7fcf8e','#7fb5f0','#d6a0e8'];
  let sel=[],words=shuf(d.groups.flatMap(x=>x.words)),got=[],miss=0;
  const draw=()=>{solved.textContent='';
    got.forEach(gi=>{const x=d.groups[gi],r=h('div','gr');r.style.background=cols[gi%4];r.append(h('b',null,x.name),h('span',null,x.words.join(', ')));solved.append(r)});
    grid.textContent='';
    words.forEach(w=>{const c=h('button','cw'+(sel.includes(w)?' on':''),w);
      c.onclick=()=>{sel=sel.includes(w)?sel.filter(y=>y!==w):(sel.length<4?[...sel,w]:sel);draw()};grid.append(c)})};
  const sub=h('button','btn','Submit'),shb=h('button','btn ghost','Shuffle'),clr=h('button','btn ghost','Deselect');
  sub.onclick=()=>{if(sel.length<4){m.textContent='Pick four words first';return}
    const gi=d.groups.findIndex(x=>x.words.every(w=>sel.includes(w)));
    if(gi>-1&&!got.includes(gi)){got.push(gi);words=words.filter(w=>!sel.includes(w));sel=[];m.textContent='';draw();if(got.length===d.groups.length)done()}
    else{miss++;const best=Math.max(...d.groups.map(x=>x.words.filter(w=>sel.includes(w)).length));
      m.textContent=(best===3?'One away! ':'Not a group. ')+'Mistakes: '+miss;shake(grid)}};
  shb.onclick=()=>{words=shuf(words);draw()};clr.onclick=()=>{sel=[];draw()};
  bar.style.justifyContent='center';bar.append(sub,shb,clr);
  draw();el.append(h('p','big','Find the four groups of four'),solved,grid,bar,m);
}
function crossword(el,d,done){
  const R=d.grid,H=R.length,W=R[0].length,C={},ins=[],g=h('div','xg'),m=h('p','msg');let dir='A';
  g.style.gridTemplateColumns='repeat('+W+',46px)';
  const wh=(r,c)=>r>=0&&c>=0&&r<H&&c<W&&R[r][c]!=='#';let n=0;
  const mv=(r,c,dr,dc)=>{r+=dr;c+=dc;while(r>=0&&c>=0&&r<H&&c<W){if(wh(r,c)){C[r+','+c].focus();return}r+=dr;c+=dc}};
  const step=()=>dir==='A'?[0,1]:[1,0];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const cell=h('div','xc');
    if(!wh(r,c)){cell.classList.add('blk');g.append(cell);continue}
    if((!wh(r,c-1)&&wh(r,c+1))||(!wh(r-1,c)&&wh(r+1,c)))cell.append(h('small',null,++n));
    const i=h('input');i.maxLength=1;i.dataset.a=R[r][c].toUpperCase();i.onfocus=()=>i.select();
    i.oninput=()=>{i.value=i.value.slice(-1).toUpperCase();if(i.value)mv(r,c,...step())};
    i.onkeydown=e=>{const D={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];
      if(D){e.preventDefault();mv(r,c,...D)}else if(e.key==='Backspace'&&!i.value){const s=step();mv(r,c,-s[0],-s[1])}};
    C[r+','+c]=i;ins.push(i);cell.append(i);g.append(cell)}
  const ul=h('ul','cl');Object.entries(d.clues).forEach(([k,v])=>ul.append(h('li',null,k+': '+v)));
  const row=h('div','row'),db=h('button','btn ghost','Typing: Across'),b=h('button','btn','Check');row.style.justifyContent='center';
  db.onclick=()=>{dir=dir==='A'?'D':'A';db.textContent='Typing: '+(dir==='A'?'Across':'Down')};
  b.onclick=()=>{const bad=ins.filter(i=>i.value.toUpperCase()!==i.dataset.a);
    if(!bad.length){done();return}
    m.textContent=bad.length+' square'+(bad.length>1?'s are':' is')+' not right yet';
    bad.filter(i=>i.value).forEach(i=>{i.parentNode.classList.add('bad');setTimeout(()=>i.parentNode.classList.remove('bad'),1200)});shake(g)};
  row.append(db,b);el.append(g,ul,row,m);
}
function semantle(el,d,done){
  const L=d.ranked.map(norm),N=L.length,list=h('div','sl'),m=h('p','msg'),f=h('div','row'),i=h('input'),b=h('button','btn','Guess');
  let gs=[];i.placeholder='Type a word';
  const go=()=>{const x=norm(i.value);if(!x)return;i.value='';
    if(x===L[0]){done();return}
    const k=L.indexOf(x);
    if(k<0){m.textContent='"'+x+'" is ice cold. Try something closer.';shake(f);return}
    m.textContent='';if(!gs.some(y=>y[1]===x))gs.push([k,x]);gs.sort((a,b)=>a[0]-b[0]);
    list.textContent='';gs.forEach(([rk,w])=>{const p=(N-rk)/(N-1)*100,row=h('div','sr'),bar=h('s'),fill=h('i');
      fill.style.cssText='width:'+Math.max(p,6)+'%;background:hsl('+Math.round(210*(1-p/100))+',85%,52%)';bar.append(fill);
      row.append(h('span',null,w),bar,h('em',null,p>70?'Hot':p>40?'Warm':'Cool'));list.append(row)})};
  b.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};f.append(i,b);
  el.append(h('p','big','Find my secret word'),h('p',null,'The closer your word is in meaning, the hotter it gets. Anything unrelated is ice cold.'),f,m,list);
}
function scramble(el,d,done){
  const a=d.answer.toUpperCase().replace(/[^A-Z]/g,''),m=h('p','msg'),slots=h('div','wr'),pool=h('div','wr'),sb=h('button','btn ghost','Shuffle');
  let L=shuf(a.split('')),pk=[];
  const draw=()=>{slots.textContent='';pool.textContent='';
    for(let i=0;i<a.length;i++){const t=h('button','t'+(pk[i]!=null?' f':''),pk[i]!=null?L[pk[i]]:'');
      t.onclick=()=>{if(pk[i]!=null){pk.splice(i,1);draw()}};slots.append(t)}
    L.forEach((ch,i)=>{if(pk.includes(i))return;const t=h('button','t tile',ch);
      t.onclick=()=>{pk.push(i);draw();if(pk.length===a.length){if(pk.map(j=>L[j]).join('')===a)done();else{m.textContent='Not quite, try again!';shake(slots);setTimeout(()=>{pk=[];draw()},600)}}};
      pool.append(t)})};
  sb.onclick=()=>{L=shuf(L);pk=[];draw()};
  draw();el.append(h('p','big',d.clue||'Tap the letters in the right order'),slots,h('p','eye','Letters'),pool,m);
  const r=h('div','row');r.style.justifyContent='center';r.append(sb);el.append(r);
}
function hints(el,d,done){
  const ol=h('ol','cl'),b=h('button','btn ghost','Reveal another hint');let n=1;
  const sh=()=>{ol.textContent='';d.hints.slice(0,n).forEach(x=>ol.append(h('li',null,x)));b.disabled=n>=d.hints.length};
  b.onclick=()=>{n++;sh()};sh();el.append(h('p','big','Who or what am I?'),ol,b);
  ask(el,[d.answer,...(d.alt||[])],done);

function firstConfiguredPhoto(friend){

 stage.addEventListener('pointermove',e=>{if(reducedMotion()||e.pointerType==='touch')return;const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;rotor.style.setProperty('--gy',(x*18).toFixed(2)+'deg');rotor.style.setProperty('--gx',(-6-y*12).toFixed(2)+'deg')});

function enableMagneticMemories(root){
 if(!window.matchMedia('(pointer:fine) and (hover:hover)').matches||reducedMotion())return;
 const cards=[...root.querySelectorAll('.float-polaroid')];
 cards.forEach(card=>card.classList.add('magnetic'));
 root.addEventListener('pointermove',e=>{for(const card of cards){const r=card.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),distance=Math.hypot(dx,dy),force=Math.max(0,1-distance/220);card.style.setProperty('--mx',(dx*force*.025).toFixed(1)+'px');card.style.setProperty('--my',(dy*force*.025).toFixed(1)+'px');card.style.opacity=String(.72+force*.19)}});
 root.addEventListener('pointerleave',()=>cards.forEach(card=>{card.style.removeProperty('--mx');card.style.removeProperty('--my');card.style.opacity=''}));
}

function openMemoryGallery(F,solved,allowPreview){

 if(!days.length)return;

 const prev=h('button',null,'← Previous'),next=h('button',null,'Next →');prev.onclick=()=>{index=(index-1+days.length)%days.length;draw()};next.onclick=()=>{index=(index+1)%days.length;draw()};actions.append(prev,next);
 const dismiss=()=>{document.removeEventListener('keydown',keys);overlay.remove()};
 const keys=e=>{if(e.key==='Escape')dismiss();else if(e.key==='ArrowLeft')prev.click();else if(e.key==='ArrowRight')next.click()};
 close.onclick=dismiss;overlay.addEventListener('click',e=>{if(e.target===overlay)dismiss()});

 overlay.append(close,heading,counter,stage,actions);document.body.append(overlay);document.addEventListener('keydown',keys);draw();close.focus();
}

function addMemoryFace(button,day,puzzle,isPreview=false){

    front.append(im);

  addEventListener('hashchange',()=>setTimeout(report,140));
  addEventListener('storage',report);
  document.addEventListener('click',()=>setTimeout(report,700));
  setTimeout(report,500);
}
